<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti — Un Libro de Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="book-container">
        <div class="book">
            <div class="book-spine"></div>
            <div class="page page-left">
                <div class="page-inner page-front"><div class="content"></div></div>
                <div class="page-inner page-back"><div class="content"></div></div>
            </div>
            <div class="page page-right">
                <div class="page-inner page-front"><div class="content"></div></div>
                <div class="page-inner page-back"><div class="content"></div></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" aria-label="Página anterior">&#9664; Anterior</button>
        <span id="pageIndicator">1 / 5</span>
        <button id="nextBtn" aria-label="Página siguiente">Siguiente &#9654;</button>
    </div>
    <audio id="pageSound" preload="auto">
        <source src="audio/page-turn.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic" preload="auto">
        <source src="audio/cancion.mp3" type="audio/mpeg">
    </audio>
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close">&times;</span>
        <img class="image-modal-content" src="" alt="Imagen ampliada">
    </div>
    <script src="script.js"></script>
</body>
</html>
